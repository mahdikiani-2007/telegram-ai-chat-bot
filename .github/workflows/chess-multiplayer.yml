name: Game frontend and backend regression checks

on:
  push:
    branches:
      - fix/chess-multiplayer-sync-orientation
      - feat/chess-room-lifecycle-and-bot
      - fix/hokm-engine-ui-animation
  pull_request:
    branches:
      - main
    paths:
      - "games/**"
      - "realtime/**"
      - "repositories/games.py"
      - "miniapp/chess-frontend/**"
      - "miniapp/hokm-frontend/**"
      - "miniapp/static/chess/**"
      - "miniapp/static/hokm/**"
      - "tests/test_chess.py"
      - "tests/test_hokm.py"
      - ".github/workflows/chess-multiplayer.yml"

permissions:
  contents: write

# Use the source branch name for both push and pull_request events so their
# generated-asset builds share one lock and cannot race while pushing output.
concurrency:
  group: game-assets-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            miniapp/chess-frontend/package-lock.json
            miniapp/hokm-frontend/package-lock.json
      - name: Install chess frontend dependencies
        run: npm ci --prefix miniapp/chess-frontend
      - name: Build chess frontend
        run: npm run build --prefix miniapp/chess-frontend
      - name: Install Hokm frontend dependencies and generate lockfile
        run: npm install --prefix miniapp/hokm-frontend
      - name: Type-check and build Hokm frontend
        run: npm run build --prefix miniapp/hokm-frontend
      - name: Commit generated production bundles
        if: ${{ github.event_name == 'push' }}
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miniapp/static/chess miniapp/static/hokm miniapp/hokm-frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(games): refresh production SPA bundles"
            git push origin "HEAD:${BRANCH_NAME}"
          fi

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run chess and Hokm regression tests
        run: pytest -q tests/test_chess.py tests/test_hokm.py
