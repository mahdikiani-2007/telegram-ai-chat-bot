name: Chess multiplayer regression checks

on:
  push:
    branches:
      - fix/chess-multiplayer-sync-orientation
  pull_request:
    branches:
      - main
    paths:
      - "games/chess/**"
      - "realtime/**"
      - "miniapp/chess-frontend/**"
      - "miniapp/static/chess/**"
      - "tests/test_chess.py"
      - ".github/workflows/chess-multiplayer.yml"

permissions:
  contents: write

jobs:
  frontend:
    # The first branch push builds and commits the generated SPA bundle.
    # Skip the follow-up push caused by that generated-bundle commit.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'build(chess): refresh production SPA bundle') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: miniapp/chess-frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix miniapp/chess-frontend
      - name: Type-check and build production chess SPA
        run: npm run build --prefix miniapp/chess-frontend
      - name: Commit generated production bundle
        if: ${{ github.event_name == 'push' }}
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miniapp/static/chess
          if ! git diff --cached --quiet; then
            git commit -m "build(chess): refresh production SPA bundle"
            git push origin "HEAD:${BRANCH_NAME}"
          fi

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run chess and realtime regression tests
        run: pytest -q tests/test_chess.py
